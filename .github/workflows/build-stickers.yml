name: Build Rila sticker assets

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  stickers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install WebP tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends webp imagemagick

      - name: Extract the supplied sticker strip into real PNG assets
        shell: bash
        run: |
          python - <<'PY'
          import base64, re
          from pathlib import Path

          src = Path('public/stickers/bouquet.svg').read_text()
          m = re.search(r'data:image/webp;base64,([^\" ]+)', src)
          if not m:
              raise SystemExit('Could not find embedded WebP in bouquet.svg')
          raw = base64.b64decode(m.group(1))
          Path('/tmp/stickers.webp').write_bytes(raw)
          print(f'Extracted embedded WebP: {len(raw)} bytes')
          PY

          # Do not use Pillow here: the GitHub runner's Python WebP decoder
          # can fail on this particular embedded asset. The official WebP
          # decoder is much more reliable.
          dwebp /tmp/stickers.webp -o /tmp/stickers.png

          width=$(identify -format '%w' /tmp/stickers.png)
          height=$(identify -format '%h' /tmp/stickers.png)
          echo "Decoded sticker strip: ${width}x${height}"

          if [ "$width" -lt 7 ]; then
            echo "Unexpected sticker strip width: $width"
            exit 1
          fi

          out="public/stickers/generated"
          mkdir -p "$out"

          names=(bouquet letter drawing music avatars pictures world)
          for i in "${!names[@]}"; do
            name="${names[$i]}"
            x0=$(( i * width / 7 ))
            x1=$(( (i + 1) * width / 7 ))
            cell_width=$(( x1 - x0 ))
            magick /tmp/stickers.png -crop "${cell_width}x${height}+${x0}+0" +repage "$out/$name.png"
            echo "Generated $name.png (${cell_width}x${height})"
          done

      - name: Commit generated assets
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/stickers/generated
          if git diff --cached --quiet; then
            echo 'No sticker changes.'
            exit 0
          fi
          git commit -m 'Generate individual Rila sticker assets'
          git push
